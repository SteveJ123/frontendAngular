<nav class="fixed top-0 left-0 right-0 z-50 bg-[#f3fab5] border-b border-[#e2e0d8] shadow-sm">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo -->
      <a routerLink="/" class="font-heading text-2xl font-bold text-[#960000]">
        Young Happy And Healthy
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <!-- [routerLinkActiveOptions]="{ exact: true }" -->
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          routerLinkActive="text-[#960000]"          
          class="text-sm font-medium transition-colors hover:text-[#960000] text-[#960000]"
        >
          {{ link.name }}
        </a>
      </div>

      <!-- CTA Button -->
      <div class="hidden md:block">
        <a
          routerLink="/login"
          class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-[#960000] hover:bg-primary/90 h-9 px-4 py-2"
        >
          Login
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button
        type="button"
        class="md:hidden p-2 text-foreground"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
      >
        <!-- Close (X) Icon -->
        <svg
          *ngIf="isOpen"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>

        <!-- Menu (Hamburger) Icon -->
        <svg
          *ngIf="!isOpen"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="4" x2="20" y1="12" y2="12"></line>
          <line x1="4" x2="20" y1="6" y2="6"></line>
          <line x1="4" x2="20" y1="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="isOpen" class="md:hidden py-4 space-y-3 animate-fade-in">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="text-[#960000]"        
        (click)="closeMenu()"
        class="block py-2 text-sm font-medium transition-colors hover:text-[#960000] text-[#960000]"
      >
        {{ link.name }}
      </a>
      
      <a
        routerLink="/login"
        (click)="closeMenu()"
        class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-[#960000]-foreground hover:bg-primary/90 h-9 px-4 py-2 w-full"
      >
        Login
      </a>
    </div>
  </div>
</nav>
