<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col relative">
  <!-- Navbar Component -->
  <!-- <app-navbar></app-navbar> -->

  <!-- Hero Section -->
  <section class="pt-24 sm:pt-28 md:pt-32 pb-12 sm:pb-16 bg-slate-100/70 dark:bg-slate-900/40">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center max-w-3xl mx-auto space-y-4 animate-fade-in">
        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-slate-900 dark:text-white">
          Get In Touch
        </h1>
        <p class="text-base sm:text-lg md:text-xl text-slate-600 dark:text-slate-400 leading-relaxed max-w-2xl mx-auto">
          Have questions? We'd love to hear from you. Send us a message and we'll respond as soon as possible.
        </p>
      </div>
    </div>
  </section>

  <!-- Main Content Section -->
  <section class="py-12 sm:py-16 md:py-20 flex-grow">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Contact Info Cards Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12 sm:mb-16">
        <div 
          *ngFor="let info of contactInfo; let i = index" 
          class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 text-center shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 animate-slide-up opacity-0"
          [style.animation-delay]="(i * 0.08) + 's'"
        >
          <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 rounded-full mb-4 group-hover:scale-110 transition-transform duration-300">
            <!-- MapPin Icon -->
            <svg *ngIf="info.type === 'pin'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>

            <!-- Phone Icon -->
            <svg *ngIf="info.type === 'phone'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>

            <!-- Mail Icon -->
            <svg *ngIf="info.type === 'mail'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>

            <!-- Clock Icon -->
            <svg *ngIf="info.type === 'clock'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 0 0118 0z"/>
            </svg>
          </div>
          <h3 class="font-semibold text-base sm:text-lg mb-2 text-slate-900 dark:text-white">{{ info.title }}</h3>
          <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed">{{ info.content }}</p>
        </div>
      </div>

      <!-- Contact Form & Map Container -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-start">
        <!-- Form Section -->
        <div class="animate-fade-in bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm">
          <h2 class="text-2xl sm:text-3xl font-bold mb-6 text-slate-900 dark:text-white tracking-tight">
            Send us a Message
          </h2>
          <form (ngSubmit)="handleSubmit($event)" class="space-y-4 sm:space-y-5">
            <div>
              <label htmlFor="name" class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">
                Name <span class="text-rose-500">*</span>
              </label>
              <input
                id="name"
                type="text"
                [(ngModel)]="formData.name"
                name="name"
                placeholder="Your name"
                required
                class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
              />
            </div>

            <div>
              <label htmlFor="email" class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">
                Email <span class="text-rose-500">*</span>
              </label>
              <input
                id="email"
                type="email"
                [(ngModel)]="formData.email"
                name="email"
                placeholder="your.email@example.com"
                required
                class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
              />
            </div>

            <div>
              <label htmlFor="phone" class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">
                Phone
              </label>
              <input
                id="phone"
                type="tel"
                [(ngModel)]="formData.phone"
                name="phone"
                placeholder="+91 9XXXXXXXXX"
                class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
              />
            </div>

            <div>
              <label htmlFor="message" class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">
                Message <span class="text-rose-500">*</span>
              </label>
              <textarea
                id="message"
                [(ngModel)]="formData.message"
                name="message"
                placeholder="Tell us how we can help..."
                rows="5"
                required
                class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200 resize-none"
              ></textarea>
            </div>

            <button
              type="submit"
              class="w-full py-3 px-6 text-sm sm:text-base font-semibold text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
            >
              Send Message
            </button>
          </form>
        </div>

        <!-- Embedded Google Map -->
        <div class="animate-fade-in h-full min-h-[380px] sm:min-h-[480px] lg:min-h-[540px] rounded-2xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-sm">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d241317.14571485888!2d72.71637033773372!3d19.08219838311904!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c6306644edc1%3A0x5da4ed8f8d648c69!2sMumbai%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1653377778431!5m2!1sen!2sin"
            width="100%"
            height="100%"
            class="w-full h-full min-h-[380px] sm:min-h-[480px] lg:min-h-[540px] border-0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Young Happy And Healthy Studio Location"
          ></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- WhatsApp Banner Section -->
  <section class="py-12 sm:py-16 md:py-20 bg-emerald-600 text-white mt-auto">
    <div class="container mx-auto px-4 text-center space-y-4 animate-fade-in">
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight">Quick Question?</h2>
      <p class="text-base sm:text-lg text-emerald-100 max-w-xl mx-auto">
        Reach out to us on WhatsApp for instant support
      </p>
      <div class="pt-2">
        <a 
          href="https://wa.me/8491057538" 
          target="_blank" 
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-white text-emerald-700 font-semibold hover:bg-emerald-50 active:bg-slate-100 transition-all duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
        >
          <!-- WhatsApp / Chat SVG -->
          <svg class="w-5 h-5 fill-emerald-600" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
          </svg>
          Chat on WhatsApp
        </a>
      </div>
    </div>
  </section>

  <!-- Footer Component -->
  <!-- <app-footer></app-footer> -->

  <!-- Floating Toast Notification -->
  <div 
    *ngIf="toast" 
    class="fixed bottom-6 right-6 z-50 max-w-sm w-full p-4 rounded-xl shadow-2xl border transition-all duration-300 animate-slide-up flex items-start justify-between gap-3"
    [ngClass]="{
      'bg-slate-900 text-white border-slate-800 dark:bg-white dark:text-slate-900': toast.variant !== 'destructive',
      'bg-rose-600 text-white border-rose-700': toast.variant === 'destructive'
    }"
  >
    <div class="space-y-1">
      <h4 class="font-semibold text-sm">{{ toast.title }}</h4>
      <p class="text-xs opacity-90">{{ toast.description }}</p>
    </div>
    <button (click)="closeToast()" class="text-xs opacity-70 hover:opacity-100 p-1">
      ✕
    </button>
  </div>
</div>
