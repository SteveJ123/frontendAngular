<div 
  class="relative h-full overflow-hidden rounded-2xl border bg-white dark:bg-slate-900 transition-all duration-300 flex flex-col justify-between p-6 sm:p-8 shadow-sm hover:shadow-xl"
  [ngClass]="{
    'border-emerald-500 shadow-md ring-2 ring-emerald-500/20': isPopular,
    'border-slate-200 dark:border-slate-800': !isPopular
  }"
>
  <!-- Popular Badge -->
  <div 
    *ngIf="isPopular" 
    class="absolute top-0 right-0 bg-emerald-600 text-white px-3.5 py-1 text-xs font-bold tracking-wider rounded-bl-xl shadow-sm uppercase"
  >
    Popular
  </div>

  <div>
    <!-- Header -->
    <div class="text-center space-y-2 mb-6">
      <h3 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
        {{ title }}
      </h3>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 min-h-[2.5rem] flex items-center justify-center">
        {{ description }}
      </p>
      <div class="pt-2 flex items-baseline justify-center gap-1">
        <span class="text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white">
          {{ price }}
        </span>
        <span *ngIf="price !== 'Free'" class="text-sm font-medium text-slate-500 dark:text-slate-400">
          /month
        </span>
      </div>
    </div>

    <!-- Features List -->
    <ul class="space-y-3.5 my-6 text-slate-700 dark:text-slate-300">
      <li *ngFor="let feature of features" class="flex items-start gap-3">
        <svg class="h-5 w-5 text-emerald-600 dark:text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        <span class="text-sm leading-relaxed">{{ feature }}</span>
      </li>
    </ul>
  </div>

  <!-- Action Button -->
  <div class="pt-4 mt-auto">
    <button 
      type="button"
      (click)="onSelectPlan()"
      class="w-full inline-flex items-center justify-center rounded-xl font-medium text-sm sm:text-base h-11 px-6 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 shadow-sm"
      [ngClass]="{
        'bg-emerald-600 hover:bg-emerald-700 text-white': isPopular,
        'border border-slate-300 dark:border-slate-700 bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white': !isPopular
      }"
    >
      {{ buttonText }}
    </button>
  </div>
</div>
