<div class="bg-gray-50 p-6 rounded-lg border shadow-sm h-dvh">
  <!-- Back Button & Header -->
  <div class="flex items-center justify-between border-b pb-4 mb-4">
    <button
      (click)="onBack()"
      class="flex items-center space-x-2 text-sm font-bold text-blue-600 hover:text-blue-800 bg-blue-50 px-3 py-2 rounded-md transition-colors"
    >
      <span>&larr; Back to Calendar</span>
    </button>
    <div class="text-right">
      <h2 class="text-lg font-bold text-gray-800">Daily Checklist</h2>
      <span class="text-xs text-gray-500 font-semibold"
        >Date: {{ selectedDate }}</span
      >
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-8 text-gray-500 font-medium">
    Loading routines...
  </div>

  <!-- Checklist List -->
  <div *ngIf="!loading && tasks.length > 0" class="space-y-3">
    <div
      *ngFor="let item of tasks; let i = index"
      (click)="toggleComplete(item, i)"
      class="flex items-center justify-between bg-white p-4 rounded-md border shadow-sm cursor-pointer hover:border-blue-400 transition-all"
      [class.bg-green-50]="item.isCompleted"
    >
      <div class="flex items-center space-x-3">
        <input
          type="checkbox"
          [checked]="item.isCompleted"
          (click)="$event.stopPropagation(); toggleComplete(item, i)"
          class="h-5 w-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"
        />
        <div>
          <span
            class="text-xs font-bold uppercase tracking-wider text-blue-700 bg-blue-100 px-2 py-0.5 rounded"
          >
            {{ item.time }}
          </span>
          <p
            class="text-sm font-medium mt-1 text-gray-800"
            [class.line-through]="item.isCompleted"
            [class.text-gray-400]="item.isCompleted"
          >
            {{ item.task }}
          </p>
        </div>
      </div>

      <span
        *ngIf="item.isCompleted"
        class="text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded"
      >
        Completed ✓
      </span>
    </div>
  </div>

  <!-- Empty State -->
  <div
    *ngIf="!loading && tasks.length === 0"
    class="text-center py-10 text-gray-400 bg-white rounded-md border border-dashed"
  >
    <p class="text-sm font-semibold">
      No tasks scheduled by the admin for this date.
    </p>
  </div>
</div>
