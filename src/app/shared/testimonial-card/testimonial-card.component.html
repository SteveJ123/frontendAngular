<div class="h-full flex flex-col justify-between p-6 sm:p-8 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-2xl hover:-translate-y-1.5 transition-all duration-300 ease-out group">
  <div class="space-y-4">
    <!-- Star Rating -->
    <div class="flex items-center gap-1">
      <ng-container *ngFor="let star of stars">
        <svg 
          class="w-5 h-5 text-amber-400 fill-amber-400 transform group-hover:scale-110 transition-transform duration-200" 
          xmlns="http://www.w3.org/2000/svg" 
          viewBox="0 0 24 24" 
          stroke="currentColor" 
          stroke-width="1"
        >
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      </ng-container>
    </div>

    <!-- Quote / Content -->
    <p class="text-sm sm:text-base text-slate-600 dark:text-slate-300 italic leading-relaxed">
      "{{ content }}"
    </p>
  </div>

  <!-- User Details -->
  <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-800 flex items-center gap-3">
    <div class="w-10 h-10 rounded-full bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 flex items-center justify-center font-bold text-base shrink-0 group-hover:scale-105 transition-transform duration-300">
      {{ name.charAt(0) }}
    </div>
    <div>
      <h4 class="text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-tight">
        {{ name }}
      </h4>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
        {{ role }}
      </p>
    </div>
  </div>
</div>
